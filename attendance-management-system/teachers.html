<!-- teachers.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teachers • AttendX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="teachers">

<div class="app">
  <div class="sidebar-backdrop" data-sidebar-close></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span>Attend<strong>X</strong></span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-block" data-logout>Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" data-sidebar-open aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">Teachers</h1>
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <div class="user-chip">
          <span class="avatar" data-user-initials>--</span>
          <span class="user-meta">
            <strong data-user-name>—</strong>
            <small data-user-role>—</small>
          </span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="page-head">
        <div>
          <h2>Teachers</h2>
          <p>Teaching staff and their assigned courses.</p>
        </div>
        <button class="btn btn-primary" id="addCourseBtn">+ Add course</button>
      </section>

      <section class="card">
        <div class="card-head"><h3>Courses</h3><small id="courseCount" class="muted"></small></div>
        <div class="card-body" id="courseTable">
          <div class="skeleton-list"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Teaching staff</h3></div>
        <div class="card-body" id="teacherTable">
          <div class="skeleton-list"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-backdrop hidden" id="courseModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="courseModalTitle">Add course</h3>
      <button class="icon-btn" data-modal-close>✕</button>
    </div>
    <form id="courseForm" class="modal-body">
      <input type="hidden" id="courseId" />
      <div class="grid-2">
        <div class="field">
          <label for="cCode">Course code</label>
          <input id="cCode" required placeholder="CS-301" />
        </div>
        <div class="field">
          <label for="cDept">Department</label>
          <input id="cDept" placeholder="Computer Science" />
        </div>
      </div>
      <div class="field">
        <label for="cTitle">Course title</label>
        <input id="cTitle" required placeholder="Data Structures &amp; Algorithms" />
      </div>
      <div class="field">
        <label for="cTeacher">Assigned teacher</label>
        <select id="cTeacher"><option value="">— Unassigned —</option></select>
      </div>
      <div class="alert error hidden" id="courseFormError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
