<!-- admin.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin • AttendX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="admin">

<div class="app">
  <div class="sidebar-backdrop" data-sidebar-close></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span>Attend<strong>X</strong></span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-block" data-logout>Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" data-sidebar-open aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <div class="user-chip">
          <span class="avatar" data-user-initials>--</span>
          <span class="user-meta">
            <strong data-user-name>—</strong>
            <small data-user-role>—</small>
          </span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="page-head">
        <div>
          <h2>Institution overview</h2>
          <p>Live snapshot of users, courses and attendance activity.</p>
        </div>
        <a href="reports.html" class="btn btn-primary">Generate report</a>
      </section>

      <section class="stats" id="stats"></section>

      <section class="split">
        <div class="card">
          <div class="card-head">
            <h3>Recent sessions</h3>
            <a href="attendance.html" class="link">View all</a>
          </div>
          <div class="card-body" id="recentSessions">
            <div class="skeleton-list"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Quick actions</h3></div>
          <div class="card-body quick-actions">
            <a class="quick" href="students.html"><span>👥</span><div><strong>Manage students</strong><small>Add, edit &amp; enroll</small></div></a>
            <a class="quick" href="teachers.html"><span>👨‍🏫</span><div><strong>Manage teachers</strong><small>Assign to courses</small></div></a>
            <a class="quick" href="attendance.html"><span>✅</span><div><strong>Attendance</strong><small>Mark &amp; monitor</small></div></a>
            <a class="quick" href="reports.html"><span>📊</span><div><strong>Reports</strong><small>Export to CSV</small></div></a>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
