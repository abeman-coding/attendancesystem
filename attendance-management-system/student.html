<!-- student.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student • AttendX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="student">

<div class="app">
  <div class="sidebar-backdrop" data-sidebar-close></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span>Attend<strong>X</strong></span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-block" data-logout>Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" data-sidebar-open aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">Student</h1>
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <div class="user-chip">
          <span class="avatar" data-user-initials>--</span>
          <span class="user-meta">
            <strong data-user-name>—</strong>
            <small data-user-role>—</small>
          </span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="page-head">
        <div>
          <h2>Hello there 👋</h2>
          <p>Check in to an open session and track your attendance percentage.</p>
        </div>
      </section>

      <section class="stats" id="stats"></section>

      <section class="split">
        <div class="card checkin-card">
          <div class="card-head"><h3>Check in</h3></div>
          <div class="card-body">
            <p class="muted">Enter the 6-character code shown by your teacher.</p>
            <form id="checkinForm" class="checkin-form">
              <input id="checkinCode" class="code-input" type="text" maxlength="6" placeholder="A7K2Q9" autocomplete="off" required />
              <button class="btn btn-primary" type="submit">Check in</button>
            </form>
            <div class="alert hidden" id="checkinMsg"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Open sessions</h3></div>
          <div class="card-body" id="openSessions">
            <div class="skeleton-list"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>My courses</h3></div>
        <div class="card-body" id="myCourses">
          <div class="skeleton-list"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Recent attendance</h3></div>
        <div class="card-body" id="recentAttendance">
          <div class="skeleton-list"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/student.js"></script>
</body>
</html>s
