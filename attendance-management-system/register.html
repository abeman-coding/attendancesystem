<!-- register.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account • AttendX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

<div class="auth-wrap">

  <aside class="auth-aside">
    <a class="brand light" href="index.html">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span>Attend<strong>X</strong></span>
    </a>
    <div class="auth-aside-body">
      <h1>Join AttendX 🚀</h1>
      <p>Create your account in under a minute and start tracking attendance smarter.</p>
      <ul class="auth-points">
        <li>✔ Free for students</li>
        <li>✔ No credit card required</li>
        <li>✔ Works on any device</li>
      </ul>
    </div>
    <p class="auth-aside-foot">© <span id="year"></span> AttendX</p>
  </aside>

  <main class="auth-main">
    <div class="auth-card wide">
      <header>
        <h2>Create your account</h2>
        <p>Fill in your details to get started</p>
      </header>

      <form id="registerForm" novalidate>
        <div class="grid-2">
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Ada Lovelace" required />
          </div>

          <div class="field">
            <label for="role">I am a…</label>
            <select id="role" name="role" required>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="officer">Attendance Officer</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@school.edu" required />
          </div>

          <div class="field">
            <label for="department">Department</label>
            <input id="department" name="department" type="text" placeholder="Computer Science" />
          </div>
        </div>

        <div class="field" id="matricField">
          <label for="matricNo">Matric / Student ID</label>
          <input id="matricNo" name="matricNo" type="text" placeholder="CS/2024/001" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="password">Password</label>
            <div class="input-group">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6" />
              <button type="button" class="input-affix" data-toggle-password="#password">Show</button>
            </div>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required />
          </div>
        </div>

        <label class="checkbox"><input type="checkbox" id="terms" required> <span>I agree to the Terms &amp; Privacy Policy</span></label>

        <div class="alert error hidden" id="registerError"></div>
        <div class="alert success hidden" id="registerSuccess"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
          <span class="btn-label">Create account</span>
        </button>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html" class="link">Sign in</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
